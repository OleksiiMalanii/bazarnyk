<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>Bazarnyk</title>
  <style>
    body { font: 14px system-ui, sans-serif; width: 320px; margin: 16px; color: #222; background: #fff; }
    label { display: block; margin: 8px 0 4px; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: 6px; }
    button { margin: 12px 8px 0 0; padding: 6px 12px; }
    #status { margin-top: 12px; color: #555; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h3>Bazarnyk</h3>
  <label for="token">Токен Telegram-бота</label>
  <input id="token" type="password" autocomplete="off">
  <label for="chatId">Chat id</label>
  <input id="chatId" autocomplete="off">
  <button id="save">Зберегти</button>
  <button id="check">Перевірити зараз</button>
  <div id="status" role="status"></div>
  <script type="module" src="options.js"></script>
</body>
</html>
